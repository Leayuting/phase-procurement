/* ================= 小工具 ================= */
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function taipeiNow() {
  return new Date(Date.now() + 8 * 3600 * 1000);
}
function taipeiDateStr(d) {
  const t = d ? new Date(d.getTime() + 8 * 3600 * 1000) : taipeiNow();
  return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0');
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const t = new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
  return `${t.getUTCFullYear()}/${String(t.getUTCMonth()+1).padStart(2,'0')}/${String(t.getUTCDate()).padStart(2,'0')} ${String(t.getUTCHours()).padStart(2,'0')}:${String(t.getUTCMinutes()).padStart(2,'0')}`;
}
function cls(...xs) { return xs.filter(Boolean).join(' '); }

/* ================= 共用 UI 元件 ================= */
function Card({ children, className }) {

}
function Button({ children, onClick, variant = 'primary', className, disabled, type = 'button' }) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-xl font-medium transition active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none px-4 py-3 text-[15px]';
  const variants = {
    primary: 'bg-ink text-cream hover:bg-black',
    brick: 'bg-brick text-white hover:bg-brick/90',
    ghost: 'bg-transparent text-ink border border-ink/20 hover:bg-black/5',
    subtle: 'bg-black/5 text-ink hover:bg-black/10'
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled} className={cls(base, variants[variant], className)}>
      {children}
    </button>
  );
}
function Spinner() {

function StaffPinPad({ store, storePinHash, onBack, onSuccess }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);

  async function submitPin(nextPin) {
    setError('');
    if (nextPin.length < PIN_LENGTH) return;
    setChecking(true);
    const hash = await sha256Hex(nextPin);
    setChecking(false);
    if (storePinHash && hash === storePinHash) {
      onSuccess();
    } else {
      setError('密碼錯誤');
      setTimeout(() => { setPin(''); setError(''); }, 500);
    }
  }
  function pressKey(k) {
    if (checking) return;
    if (k === 'del') { setPin(p => p.slice(0, -1)); return; }
    setPin(p => {
      if (p.length >= PIN_LENGTH) return p;
      const next = p + k;
      if (next.length === PIN_LENGTH) submitPin(next);
      return next;
    });
  }

  if (!storePinHash) {
    return (
      <div className="w-full max-w-sm mx-auto text-center px-6">
        <p className="text-lg font-bold mb-1">{store}</p>
        <p className="text-sm text-ink/40 py-6">此門市尚未設定登入 PIN，請聯絡管理者</p>
        <button onClick={onBack} className="mt-2 text-sm text-ink/40 underline">返回選擇門市</button>
      </div>
    );
  }

  return (
    <div className="w-full max-w-xs mx-auto text-center px-6">
      <p className="text-lg font-bold mb-1">{store}</p>
      <p className="text-sm text-ink/50 mb-6">請輸入 {PIN_LENGTH} 位數 PIN 碼</p>
      <div className="flex justify-center gap-2 mb-3 flex-wrap">
        {Array.from({ length: PIN_LENGTH }, (_, i) => i).map(i => (
          <div key={i} className={cls('w-3.5 h-3.5 rounded-full border border-ink', i < pin.length ? 'bg-ink' : 'bg-transparent')} />
        ))}
      </div>
      <p className="text-brick text-sm h-5 mb-2">{error}</p>
      <div className="grid grid-cols-3 gap-2.5">
        {['1','2','3','4','5','6','7','8','9','','0','del'].map((k, i) => (
          k === '' ? <div key={i} /> :
          <button key={i} onClick={() => pressKey(k)}
            className="h-14 rounded-xl border border-ink/10 bg-white text-lg font-medium active:scale-[0.96] transition">
            {k === 'del' ? '清除' : k}
          </button>
        ))}
      </div>
      <button onClick={onBack} className="mt-6 text-sm text-ink/40 underline">返回選擇門市</button>
    </div>
  );
}

function StatCard({ num, label }) {

function StatusPill({ status }) {
  const meta = STATUS_META[status] || { label: status, color: '#999' };
  return (
    <span className="text-xs font-bold px-2.5 py-1 rounded-full text-white" style={{ background: meta.color }}>
      {meta.label}

}

function Dashboard({ session, onNavigate }) {
  const [loading, setLoading] = useState(true);
  const [rows, setRows] = useState([]);
  const [storeFilter, setStoreFilter] = useState('all');
  const isAdmin = session.role === 'admin';

  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('purchase_requests').select('*').order('created_at', { ascending: false }).limit(50);
    if (!isAdmin) q = q.eq('store', session.store);
    else if (storeFilter !== 'all') q = q.eq('store', storeFilter);
    const { data, error } = await q;
    setRows(error ? [] : data);
    setLoading(false);
  }, [isAdmin, session.store, storeFilter]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel('dashboard-requests')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'purchase_requests' }, load)
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [load]);

  const today = taipeiDateStr();
  const stats = useMemo(() => {
    const todays = rows.filter(r => taipeiDateStr(new Date(r.created_at)) === today);
    const pendingToday = todays.filter(r => r.status !== 'done' && r.status !== 'cancelled').length;
    const buyToday = todays.filter(r => r.status === 'pending').length;
    const doneToday = todays.filter(r => r.status === 'done').length;
    return { pendingToday, buyToday, doneToday };
  }, [rows, today]);

  return (
    <div className="pb-28">
      <div className="flex items-center justify-between mb-4">
        <div>
          <p className="text-lg font-bold">Dashboard</p>
          <p className="text-xs text-ink/40">{isAdmin ? '全部門市 · ' + session.name : session.store}</p>
        </div>
        {isAdmin && (
          <select value={storeFilter} onChange={e => setStoreFilter(e.target.value)}
            className="text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white">
            <option value="all">全部門市</option>
            {STORES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        )}
      </div>

      <div className="grid grid-cols-3 gap-2.5 mb-6">
        <StatCard num={stats.pendingToday} label="今日待處理" />
        <StatCard num={stats.buyToday} label="待採購" />
        <StatCard num={stats.doneToday} label="已完成" />
      </div>

      <p className="text-sm font-medium text-ink/60 mb-2">最近送出的採購</p>
      {loading ? <Spinner /> : (
        <div className="flex flex-col gap-2">
          {rows.slice(0, 12).map(r => (
            <Card key={r.id} className="px-4 py-3 flex items-center justify-between">
              <div className="min-w-0">
                <p className="font-mono text-sm font-semibold truncate">{r.request_no}</p>
                <p className="text-xs text-ink/40 mt-0.5">{isAdmin ? r.store + ' · ' : ''}{fmtDateTime(r.created_at)}{r.urgent ? ' · 急件' : ''}</p>
              </div>
              {isAdmin ? <StatusPill status={r.status} /> : (
                <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-black/5 text-ink/70">{SIMPLE_STATUS(r.status)}</span>
              )}
            </Card>
          ))}
          {rows.length === 0 && <p className="text-sm text-ink/40 text-center py-10">目前沒有採購紀錄</p>}
        </div>
      )}

      {!isAdmin && (
        <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-cream via-cream to-transparent safe-bottom">
          <Button variant="brick" className="w-full max-w-md mx-auto flex" onClick={() => onNavigate('new')}>
            快速新增採購
          </Button>
        </div>
      )}
    </div>
  );
}

/* ================= 新增採購 ================= */
const SOURCE_OPTIONS = ['蝦皮', '酷澎', '其他'];

function QtyStepper({ value, onChange }) {
  return (
    <div className="flex items-center gap-3">
      <button type="button" onClick={() => onChange(Math.max(1, value - 1))}
        className="w-8 h-8 rounded-full border border-ink/20 flex items-center justify-center text-lg leading-none active:scale-95 transition">−</button>
      <input type="number" min="1" value={value}
        onChange={e => onChange(Math.max(1, parseInt(e.target.value, 10) || 1))}
        className="w-12 text-center border border-ink/15 rounded-lg py-1 text-[15px]" />
      <button type="button" onClick={() => onChange(value + 1)}
        className="w-8 h-8 rounded-full border border-ink/20 flex items-center justify-center text-lg leading-none active:scale-95 transition">+</button>
    </div>
  );
}

function CustomItemForm({ onAdd, onCancel }) {
  const [name, setName] = useState('');
  const [qty, setQty] = useState(1);
  const [source, setSource] = useState('');
  const [url, setUrl] = useState('');
  const [remark, setRemark] = useState('');
  const [err, setErr] = useState('');

  function submit() {
    if (!name.trim()) { setErr('請填寫商品名稱'); return; }
    if (!qty || qty < 1) { setErr('請確認數量'); return; }
    if (!source) { setErr('請選擇來源'); return; }
    onAdd({
      key: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      product_id: null,
      product_name: name.trim(),
      quantity: qty,
      source,
      url: url.trim() || null,
      item_remark: remark.trim() || null
    });
  }

  return (
    <Card className="p-4 mt-3">
      <p className="text-sm font-bold mb-3">新增其他商品</p>
      <div className="flex flex-col gap-2.5">
        <input placeholder="商品名稱" value={name} onChange={e => setName(e.target.value)}
          className="w-full px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
        <div className="flex items-center justify-between">
          <span className="text-sm text-ink/50">數量</span>
          <QtyStepper value={qty} onChange={setQty} />
        </div>
        <div className="flex gap-2">
          {SOURCE_OPTIONS.map(s => (
            <button key={s} type="button" onClick={() => setSource(s)}
              className={cls('flex-1 py-2 rounded-lg border text-sm font-medium transition',
                source === s ? 'bg-ink text-cream border-ink' : 'border-ink/15 text-ink/70')}>
              {s}
            </button>
          ))}
        </div>
        <input placeholder="商品網址（選填）" value={url} onChange={e => setUrl(e.target.value)}
          className="w-full px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
        <textarea placeholder="備註（選填）" value={remark} onChange={e => setRemark(e.target.value)} rows={2}
          className="w-full px-3 py-2.5 rounded-lg border border-ink/15 text-[15px] resize-none" />
        {err && <p className="text-brick text-sm">{err}</p>}
        <div className="flex gap-2 mt-1">
          <Button variant="subtle" className="flex-1" onClick={onCancel}>取消</Button>
          <Button className="flex-1" onClick={submit}>加入清單</Button>
        </div>
      </div>
    </Card>
  );
}

function NewRequest({ session, onNavigate }) {
  const [allProducts, setAllProducts] = useState([]);
  const [loadingProducts, setLoadingProducts] = useState(true);
  const [search, setSearch] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [showCustomForm, setShowCustomForm] = useState(false);
  const [urgent, setUrgent] = useState(false);
  const [cart, setCart] = useState([]);
  const [remark, setRemark] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');
  const [successNo, setSuccessNo] = useState(null);
  const [applicantName, setApplicantName] = useState('');

  useEffect(() => {
    sb.from('products').select('*').eq('enabled', true).order('category').order('name')
      .then(({ data, error }) => {
        setAllProducts(error ? [] : data);
        setLoadingProducts(false);
      });
  }, []);

  useEffect(() => {
    if (!successNo) return;
    const t = setTimeout(() => onNavigate('dashboard'), 3000);
    return () => clearTimeout(t);
  }, [successNo, onNavigate]);

  const availableCategories = useMemo(() =>
    Array.from(new Set(allProducts.map(p => p.category))), [allProducts]);

  const visibleProducts = useMemo(() => {
    const term = search.trim().toLowerCase();
    let list = allProducts;
    if (categoryFilter !== 'all') list = list.filter(p => p.category === categoryFilter);
    if (term) list = list.filter(p => p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term));
    return list;
  }, [search, categoryFilter, allProducts]);

  const groupedProducts = useMemo(() => {
    const groups = [];
    const byCategory = {};
    visibleProducts.forEach(p => {
      if (!byCategory[p.category]) { byCategory[p.category] = []; groups.push(p.category); }
      byCategory[p.category].push(p);
    });
    return groups.map(cat => ({ category: cat, items: byCategory[cat] }));
  }, [visibleProducts]);

  function addProduct(p) {
    setCart(prev => {
      const existing = prev.find(it => it.product_id === p.id);
      if (existing) {
        return prev.map(it => it.product_id === p.id ? { ...it, quantity: it.quantity + 1 } : it);
      }
      return [...prev, { key: 'p-' + p.id, product_id: p.id, product_name: p.name, quantity: 1, source: null, url: null, item_remark: null }];
    });
    setSearch('');
  }
  function addCustom(item) {
    setCart(prev => [...prev, item]);
    setShowCustomForm(false);
  }
  function updateQty(key, qty) {
    setCart(prev => prev.map(it => it.key === key ? { ...it, quantity: qty } : it));
  }
  function removeItem(key) {
    setCart(prev => prev.filter(it => it.key !== key));
  }

  async function submit() {
    setError('');
    if (!applicantName.trim()) { setError('請填寫送單人員'); return; }
    if (cart.length === 0) { setError('請至少加入一項商品'); return; }
    setSubmitting(true);
    const { data, error: rpcError } = await sb.rpc('create_purchase_request', {
      p_store: session.store,
      p_applicant_name: applicantName.trim(),
      p_urgent: urgent,
      p_remark: remark.trim() || null,
      p_items: cart.map(it => ({
        product_id: it.product_id,
        product_name: it.product_name,
        quantity: it.quantity,
        source: it.source,
        url: it.url,
        item_remark: it.item_remark
      }))
    });
    setSubmitting(false);
    if (rpcError) { setError('送出失敗，請稍後再試'); return; }
    setSuccessNo(data.request_no);
  }

  if (successNo) {

  return (
    <div className="pb-28">
      <p className="text-lg font-bold mb-4">新增採購</p>

      <Card className="p-4 mb-4">
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm text-ink/50">門市</span>
          <span className="text-sm font-medium">{session.store}</span>
        </div>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm text-ink/50">送單人員</span>
          <input value={applicantName} onChange={e => setApplicantName(e.target.value)} placeholder="請輸入姓名"
            className="text-sm font-medium border border-ink/15 rounded-lg px-2.5 py-1.5 bg-white text-right w-32" />
        </div>
        <div className="flex items-center justify-between">
          <span className="text-sm text-ink/50">是否急件</span>
          <div className="flex gap-2">
            <button type="button" onClick={() => setUrgent(false)}

                !urgent ? 'bg-ink text-cream border-ink' : 'border-ink/15 text-ink/60')}>一般</button>
            <button type="button" onClick={() => setUrgent(true)}
              className={cls('px-4 py-1.5 rounded-full text-sm font-medium border transition',
                urgent ? 'bg-brick text-white border-brick' : 'border-ink/15 text-ink/60')}>急件</button>
          </div>
        </div>
      </Card>

      {!showCustomForm && (
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="搜尋商品（名稱／分類），或直接從下面清單瀏覽"
          className="w-full px-4 py-3 rounded-xl border border-ink/15 bg-white text-[15px] mb-2" />
      )}

      <div className="flex items-center gap-2 mb-2">
        {!showCustomForm && (
          <div className="flex gap-2 overflow-x-auto pb-1 flex-1 min-w-0 -mx-1 px-1">
            <button type="button" onClick={() => setCategoryFilter('all')}
              className={cls('shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border transition',
                categoryFilter === 'all' ? 'bg-ink text-cream border-ink' : 'border-ink/15 text-ink/60')}>
              全部
            </button>
            {availableCategories.map(c => (
              <button key={c} type="button" onClick={() => setCategoryFilter(c)}
                className={cls('shrink-0 px-3 py-1.5 rounded-full text-sm font-medium border transition',
                  categoryFilter === c ? 'bg-ink text-cream border-ink' : 'border-ink/15 text-ink/60')}>
                {c}
              </button>
            ))}
          </div>
        )}
        <button type="button" onClick={() => setShowCustomForm(s => !s)}
          className={cls('shrink-0 px-3 py-1.5 rounded-full text-sm font-bold border transition',
            showCustomForm ? 'bg-brick text-white border-brick' : 'border-brick text-brick hover:bg-brick hover:text-white')}>
          新增商品
        </button>
      </div>

      {showCustomForm && <CustomItemForm onAdd={addCustom} onCancel={() => setShowCustomForm(false)} />}

      {!showCustomForm && (
      <Card className="mb-2 overflow-y-auto" style={{ maxHeight: '340px' }}>
        {loadingProducts ? <div className="py-6 text-center text-sm text-ink/40">載入中…</div> : (
          groupedProducts.length > 0 ? (
            groupedProducts.map(group => (
              <div key={group.category}>
                <p className="px-4 pt-3 pb-1 text-xs font-bold text-ink/40 sticky top-0 bg-white">{group.category}</p>
                <div className="divide-y divide-black/5">
                  {group.items.map(p => (
                    <button key={p.id} type="button" onClick={() => addProduct(p)}
                      className="w-full text-left px-4 py-3 hover:bg-black/5 flex items-center justify-between">
                      <span className="text-[15px]">{p.name}</span>
                      <span className="text-xs text-ink/40">{p.unit}</span>
                    </button>
                  ))}
                </div>
              </div>
            ))
          ) : (
            <div className="py-6 text-center text-sm text-ink/40">找不到符合的商品</div>
          )
        )}
      </Card>
      )}

      <p className="text-sm font-medium text-ink/60 mt-6 mb-2">採購清單（{cart.length}）</p>
      <div className="flex flex-col gap-2 mb-4">
        {cart.map(it => (
          <Card key={it.key} className="px-4 py-3 flex items-center justify-between gap-3">
            <div className="min-w-0 flex-1">
              <p className="text-[15px] font-medium truncate">{it.product_name}</p>
              {it.source && <p className="text-xs text-ink/40 mt-0.5">來源：{it.source}{it.item_remark ? ' · ' + it.item_remark : ''}</p>}
            </div>
            <QtyStepper value={it.quantity} onChange={q => updateQty(it.key, q)} />
            <button type="button" onClick={() => removeItem(it.key)} className="text-ink/30 hover:text-brick text-lg px-1">🗑️</button>
          </Card>
        ))}
        {cart.length === 0 && <p className="text-sm text-ink/30 text-center py-8">尚未加入任何商品</p>}
      </div>

      <textarea value={remark} onChange={e => setRemark(e.target.value)} placeholder="整單備註（選填）" rows={3}
        className="w-full px-4 py-3 rounded-xl border border-ink/15 bg-white text-[15px] resize-none mb-2" />
      {error && <p className="text-brick text-sm mb-2">{error}</p>}

      <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-cream via-cream to-transparent safe-bottom">
        <Button variant="brick" disabled={submitting} onClick={submit} className="w-full max-w-md mx-auto flex relative">
          {submitting ? '送出中…' : '送出採購'}
          {!submitting && cart.length > 0 && (
            <span className="absolute -top-2 -right-2 min-w-[22px] h-[22px] px-1 rounded-full bg-ink text-cream text-xs font-bold flex items-center justify-center border-2 border-cream">
              {cart.length}
            </span>
          )}
        </Button>
      </div>
    </div>
  );
}

        className="text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white">

        {STATUS_ORDER.map(s => <option key={s} value={s}>{STATUS_META[s].label}</option>)}

    </Card>
  );
}

function taipeiDayToUtc(dateStr, endOfDay) {
  const base = Date.parse(dateStr + 'T00:00:00Z') - 8 * 3600 * 1000;
  return new Date(base + (endOfDay ? 24 * 3600 * 1000 - 1 : 0)).toISOString();
}

function ManagePage({ session, onNavigate, initialRequestId }) {
  const [filters, setFilters] = useState({ store: 'all', status: 'all', dateFrom: '', dateTo: '', productSearch: '' });
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [usersMap, setUsersMap] = useState({});
  const [selectedId, setSelectedId] = useState(initialRequestId || null);

  useEffect(() => {
    sb.from('users').select('id,name').then(({ data }) => {
      const m = {};
      (data || []).forEach(u => { m[u.id] = u.name; });
      setUsersMap(m);
    });
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    let matchIds = null;
    if (filters.productSearch.trim()) {
      const { data: itemRows } = await sb.from('purchase_items').select('request_id')
        .ilike('product_name', `%${filters.productSearch.trim()}%`);
      matchIds = Array.from(new Set((itemRows || []).map(r => r.request_id)));
      if (matchIds.length === 0) { setRows([]); setLoading(false); return; }
    }
    let q = sb.from('purchase_requests').select('*, purchase_items(count)').order('created_at', { ascending: false });
    if (filters.store !== 'all') q = q.eq('store', filters.store);
    if (filters.status !== 'all') q = q.eq('status', filters.status);
    if (filters.dateFrom) q = q.gte('created_at', taipeiDayToUtc(filters.dateFrom, false));
    if (filters.dateTo) q = q.lte('created_at', taipeiDayToUtc(filters.dateTo, true));
    if (matchIds) q = q.in('id', matchIds);
    const { data, error } = await q.limit(300);
    setRows(error ? [] : data);
    setLoading(false);
  }, [filters]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel('manage-requests')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'purchase_requests' }, load)
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [load]);

  const [exporting, setExporting] = useState(false);
  async function exportExcel() {
    if (rows.length === 0) return;
    setExporting(true);
    const ids = rows.map(r => r.id);
    const { data: itemRows } = await sb.from('purchase_items').select('*, products(unit,supplier)').in('request_id', ids);
    const reqById = {};
    rows.forEach(r => { reqById[r.id] = r; });
    const exportRows = (itemRows || []).map(it => {
      const req = reqById[it.request_id];
      return {
        '採購單號': req.request_no,
        '日期': fmtDateTime(req.created_at),
        '門市': req.store,
        '申請人': req.applicant_name || '',
        '商品名稱': it.product_name,
        '數量': it.quantity,
        '單位': (it.products && it.products.unit) || '',
        '供應商': (it.products && it.products.supplier) || '',
        '來源': it.source || '',
        '狀態': STATUS_META[req.status] ? STATUS_META[req.status].label : req.status,
        '備註': it.item_remark || req.remark || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(exportRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '採購明細');
    XLSX.writeFile(wb, `PHASE採購紀錄_${taipeiDateStr().replace(/-/g, '')}.xlsx`);
    setExporting(false);
  }

  if (selectedId) {
    return <ManageDetail requestId={selectedId} session={session} usersMap={usersMap}
      onBack={() => { setSelectedId(null); load(); }} />;
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <p className="text-lg font-bold">採購管理</p>
        <Button variant="ghost" disabled={exporting || rows.length === 0} onClick={exportExcel}>
          {exporting ? '匯出中…' : '匯出 Excel'}
        </Button>
      </div>
      <ManageFilterBar filters={filters} onChange={setFilters} />

      {loading ? <Spinner /> : rows.length === 0 ? (
        <p className="text-sm text-ink/40 text-center py-16">沒有符合條件的採購單</p>
      ) : (
        <React.Fragment>
          {/* 桌機 Table */}
          <div className="hidden md:block overflow-x-auto rounded-2xl border border-black/5 bg-white">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-ink/40 border-b border-black/5">
                  <th className="px-4 py-3 font-medium">採購單號</th>
                  <th className="px-4 py-3 font-medium">日期</th>
                  <th className="px-4 py-3 font-medium">門市</th>
                  <th className="px-4 py-3 font-medium">申請人</th>
                  <th className="px-4 py-3 font-medium">商品數</th>
                  <th className="px-4 py-3 font-medium">急件</th>
                  <th className="px-4 py-3 font-medium">狀態</th>
                  <th className="px-4 py-3 font-medium"></th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.id} className="border-b border-black/5 last:border-0 hover:bg-black/[0.02]">
                    <td className="px-4 py-3 font-mono font-medium">{r.request_no}</td>
                    <td className="px-4 py-3 text-ink/60">{fmtDateTime(r.created_at)}</td>
                    <td className="px-4 py-3">{r.store}</td>
                    <td className="px-4 py-3">{r.applicant_name || '—'}</td>
                    <td className="px-4 py-3">{r.purchase_items?.[0]?.count ?? 0}</td>
                    <td className="px-4 py-3">{r.urgent ? <span className="text-brick font-bold">急件</span> : ''}</td>
                    <td className="px-4 py-3"><StatusPill status={r.status} /></td>
                    <td className="px-4 py-3">
                      <button onClick={() => setSelectedId(r.id)} className="text-sm underline text-ink/60">查看</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 手機卡片 */}
          <div className="md:hidden flex flex-col gap-2">
            {rows.map(r => (
              <Card key={r.id} className="p-4 cursor-pointer" onClick={() => setSelectedId(r.id)}>
                <div className="flex items-center justify-between mb-1.5">
                  <span className="font-mono font-semibold text-sm">{r.request_no}</span>
                  <StatusPill status={r.status} />
                </div>
                <p className="text-xs text-ink/40">{r.store} · {r.applicant_name || '—'} · {fmtDateTime(r.created_at)}</p>
                <div className="flex items-center justify-between mt-2">
                  <span className="text-xs text-ink/40">{r.purchase_items?.[0]?.count ?? 0} 項商品</span>
                  {r.urgent && <span className="text-xs text-brick font-bold">急件</span>}
                </div>
              </Card>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function ManageDetail({ requestId, session, usersMap, onBack }) {
  const [req, setReq] = useState(null);
  const [items, setItems] = useState([]);
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [remarkDraft, setRemarkDraft] = useState('');
  const [itemDrafts, setItemDrafts] = useState({});
  const [conflictMsg, setConflictMsg] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    const [{ data: reqData }, { data: itemData }, { data: logData }] = await Promise.all([
      sb.from('purchase_requests').select('*').eq('id', requestId).single(),
      sb.from('purchase_items').select('*').eq('request_id', requestId).order('id'),
      sb.from('status_logs').select('*').eq('request_id', requestId).order('created_at', { ascending: false })
    ]);
    setReq(reqData || null);
    setItems(itemData || []);
    setLogs(logData || []);
    setRemarkDraft(reqData?.remark || '');
    const drafts = {};
    (itemData || []).forEach(it => { drafts[it.id] = it.item_remark || ''; });
    setItemDrafts(drafts);
    setLoading(false);
  }, [requestId]);

  useEffect(() => { load(); }, [load]);

  async function changeStatus(newStatus) {
    if (!req || newStatus === req.status) return;
    const { data, error } = await sb.from('purchase_requests')
      .update({ status: newStatus, updated_at: new Date().toISOString() })
      .eq('id', req.id).eq('status', req.status).select();
    if (error || !data || data.length === 0) {
      setConflictMsg('此筆資料剛被其他人更新，已重新整理');
      await load();
      return;
    }
    await sb.from('status_logs').insert({
      request_id: req.id, old_status: req.status, new_status: newStatus,
      operator_id: session.userId, note: null
    });
    await load();
  }

  async function saveRemark() {
    await sb.from('purchase_requests').update({
      remark: remarkDraft.trim() || null,
      remark_updated_at: new Date().toISOString(),
      remark_updated_by: session.userId
    }).eq('id', req.id);
    await load();
  }

  async function saveItemRemark(itemId) {
    await sb.from('purchase_items').update({
      item_remark: (itemDrafts[itemId] || '').trim() || null,
      item_remark_updated_at: new Date().toISOString(),
      item_remark_updated_by: session.userId
    }).eq('id', itemId);
    await load();
  }

  if (loading || !req) return <Spinner />;

  return (
    <div className="pb-10">
      <button onClick={onBack} className="text-sm text-ink/50 underline mb-4">← 返回列表</button>

      <div className="flex items-center justify-between mb-1">
        <p className="text-xl font-black font-mono">{req.request_no}</p>
        {req.urgent && <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-brick text-white">急件</span>}
      </div>
      <p className="text-sm text-ink/40 mb-5">{req.store} · {req.applicant_name || '—'} · {fmtDateTime(req.created_at)}</p>

      <Card className="p-4 mb-4">
        <p className="text-sm font-bold mb-3">狀態</p>
        <div className="flex flex-wrap gap-2">
          {STATUS_ORDER.map(s => (
            <button key={s} onClick={() => changeStatus(s)}
              className={cls('px-3 py-2 rounded-lg text-sm font-medium border transition',
                req.status === s ? 'text-white border-transparent' : 'border-ink/15 text-ink/60 hover:border-ink/30')}
              style={req.status === s ? { background: STATUS_META[s].color } : {}}>
              {STATUS_META[s].label}
            </button>
          ))}
        </div>
        {conflictMsg && <p className="text-brick text-sm mt-2">{conflictMsg}</p>}
      </Card>

      <Card className="p-4 mb-4">
        <p className="text-sm font-bold mb-3">商品清單</p>
        <div className="flex flex-col gap-3">
          {items.map(it => (
            <div key={it.id} className="border-b border-black/5 last:border-0 pb-3 last:pb-0">
              <div className="flex items-center justify-between">
                <p className="text-[15px] font-medium">{it.product_name}</p>
                <p className="text-sm text-ink/50">× {it.quantity}</p>
              </div>
              {it.source && <p className="text-xs text-ink/40 mt-0.5">來源：{it.source}{it.url ? '　' : ''}{it.url && <a href={it.url} target="_blank" rel="noreferrer" className="underline">連結</a>}</p>}
              <div className="flex items-center gap-2 mt-2">
                <input value={itemDrafts[it.id] || ''} onChange={e => setItemDrafts(d => ({ ...d, [it.id]: e.target.value }))}
                  placeholder="商品備註（如：缺貨、改其他品牌）"
                  className="flex-1 text-sm px-3 py-2 rounded-lg border border-ink/15" />
                <button onClick={() => saveItemRemark(it.id)} className="text-sm text-ink/60 underline whitespace-nowrap">儲存</button>
              </div>
              {it.item_remark_updated_at && (
                <p className="text-[11px] text-ink/30 mt-1">
                  {usersMap[it.item_remark_updated_by] || '—'} 於 {fmtDateTime(it.item_remark_updated_at)} 更新
                </p>
              )}
            </div>
          ))}
        </div>
      </Card>

      <Card className="p-4 mb-4">
        <p className="text-sm font-bold mb-3">整單備註</p>
        <textarea value={remarkDraft} onChange={e => setRemarkDraft(e.target.value)} rows={3}
          className="w-full px-3 py-2.5 rounded-lg border border-ink/15 text-[15px] resize-none mb-2" />
        <Button variant="subtle" onClick={saveRemark}>儲存備註</Button>
        {req.remark_updated_at && (
          <p className="text-[11px] text-ink/30 mt-2">
            {usersMap[req.remark_updated_by] || '—'} 於 {fmtDateTime(req.remark_updated_at)} 更新
          </p>
        )}
      </Card>

      <Card className="p-4">
        <p className="text-sm font-bold mb-3">狀態異動紀錄</p>
        {logs.length === 0 ? <p className="text-sm text-ink/30">尚無紀錄</p> : (
          <div className="flex flex-col gap-2">
            {logs.map(l => (
              <div key={l.id} className="text-sm text-ink/60">
                <span className="font-medium text-ink">{usersMap[l.operator_id] || '—'}</span>
                {' '}將狀態改為 <span className="font-medium">{STATUS_META[l.new_status]?.label || l.new_status}</span>
                {l.note ? `（${l.note}）` : ''}
                <span className="text-ink/30"> · {fmtDateTime(l.created_at)}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ================= 商品管理（管理者） ================= */
const CATEGORIES = ['杯具','盤具','餐具','文具','糖漿/果漿','茶粉','乳製品','耗材','清潔用品','超市用品','其他'];
const UNITS = ['個','組','瓶','包','箱'];

function ProductForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial?.name || '');
  const [category, setCategory] = useState(initial?.category || CATEGORIES[0]);
  const [unit, setUnit] = useState(initial?.unit || UNITS[0]);
  const [supplier, setSupplier] = useState(initial?.supplier || '');
  const [err, setErr] = useState('');

  function submit() {
    if (!name.trim()) { setErr('請填寫商品名稱'); return; }
    onSave({ name: name.trim(), category, unit, supplier: supplier.trim() || null });
  }

  return (
    <Card className="p-4 mb-3">
      <div className="grid grid-cols-2 gap-2.5 mb-2.5">
        <input placeholder="商品名稱" value={name} onChange={e => setName(e.target.value)}
          className="col-span-2 px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
        <select value={category} onChange={e => setCategory(e.target.value)} className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]">
          {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={unit} onChange={e => setUnit(e.target.value)} className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]">
          {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
        </select>
        <input placeholder="供應商（選填）" value={supplier} onChange={e => setSupplier(e.target.value)}
          className="col-span-2 px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
      </div>
      {err && <p className="text-brick text-sm mb-2">{err}</p>}
      <div className="flex gap-2">
        <Button variant="subtle" className="flex-1" onClick={onCancel}>取消</Button>
        <Button className="flex-1" onClick={submit}>{initial ? '儲存' : '新增'}</Button>
      </div>
    </Card>
  );
}

function parseProductsCsv(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  for (let i = 0; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim());
    if (i === 0 && (cols[0] === '名稱' || cols[0].toLowerCase() === 'name')) continue;
    if (!cols[0]) continue;
    rows.push({ name: cols[0], category: cols[1] || '其他', unit: cols[2] || '個', supplier: cols[3] || null });
  }
  return rows;
}

function ProductsTab() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [importMsg, setImportMsg] = useState('');
  const fileInputRef = useRef(null);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await sb.from('products').select('*').order('category').order('name');
    setProducts(error ? [] : data);
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  async function saveProduct(fields) {
    if (editing) {
      await sb.from('products').update(fields).eq('id', editing.id);
    } else {
      await sb.from('products').insert(fields);
    }
    setShowForm(false); setEditing(null);
    await load();
  }
  async function toggleEnabled(p) {
    await sb.from('products').update({ enabled: !p.enabled }).eq('id', p.id);
    await load();
  }

  async function handleCsvFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const rows = parseProductsCsv(text);
    if (rows.length === 0) { setImportMsg('沒有讀到有效的資料列'); return; }
    const { error } = await sb.from('products').insert(rows);
    setImportMsg(error ? '匯入失敗' : `已匯入 ${rows.length} 筆商品`);
    if (fileInputRef.current) fileInputRef.current.value = '';
    await load();
  }

  const visible = categoryFilter === 'all' ? products : products.filter(p => p.category === categoryFilter);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}
          className="text-sm border border-ink/15 rounded-lg px-3 py-2 bg-white">
          <option value="all">全部分類</option>
          {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div className="flex gap-2">
          <input ref={fileInputRef} type="file" accept=".csv" onChange={handleCsvFile} className="hidden" id="csvInput" />
          <Button variant="ghost" onClick={() => fileInputRef.current?.click()}>CSV 匯入</Button>
          <Button onClick={() => { setEditing(null); setShowForm(true); }}>新增商品</Button>
        </div>
      </div>
      {importMsg && <p className="text-sm text-ink/50 mb-2">{importMsg}</p>}

      {showForm && (
        <ProductForm initial={editing} onSave={saveProduct} onCancel={() => { setShowForm(false); setEditing(null); }} />
      )}

      {loading ? <Spinner /> : (
        <div className="flex flex-col gap-2">
          {visible.map(p => (
            <Card key={p.id} className={cls('px-4 py-3 flex items-center justify-between gap-3', !p.enabled && 'opacity-50')}>
              <div className="min-w-0">
                <p className="text-[15px] font-medium truncate">{p.name}</p>
                <p className="text-xs text-ink/40 mt-0.5">{p.category} · {p.unit}{p.supplier ? ' · ' + p.supplier : ''}</p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={() => { setEditing(p); setShowForm(true); }} className="text-sm text-ink/50 underline">編輯</button>
                <button onClick={() => toggleEnabled(p)} className={cls('text-sm underline', p.enabled ? 'text-brick' : 'text-ink/50')}>
                  {p.enabled ? '停用' : '啟用'}
                </button>
              </div>
            </Card>
          ))}
          {visible.length === 0 && <p className="text-sm text-ink/40 text-center py-10">沒有商品</p>}
        </div>
      )}
    </div>
  );
}

function StorePinResetInline({ onSave, onCancel }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  async function submit() {
    if (!new RegExp(`^\\d{${PIN_LENGTH}}$`).test(pin)) { setErr(`PIN 需為 ${PIN_LENGTH} 位數字`); return; }
    onSave(await sha256Hex(pin));
  }
  return (
    <div className="flex items-center gap-2 mt-2">
      <input placeholder={`新 PIN（${PIN_LENGTH} 碼）`} value={pin} inputMode="numeric" maxLength={PIN_LENGTH}
        onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, PIN_LENGTH))}
        className="text-sm px-3 py-2 rounded-lg border border-ink/15 w-40" />
      <button onClick={submit} className="text-sm text-ink/60 underline">儲存</button>
      <button onClick={onCancel} className="text-sm text-ink/30 underline">取消</button>
      {err && <span className="text-brick text-xs">{err}</span>}
    </div>
  );
}

function StorePinTab() {
  const [resettingStore, setResettingStore] = useState(null);
  const [savedStore, setSavedStore] = useState(null);

  async function resetStorePin(store, hash) {
    await sb.from('store_pins').upsert({ store, pin_hash: hash, updated_at: new Date().toISOString() });
    setResettingStore(null);
    setSavedStore(store);
    setTimeout(() => setSavedStore(null), 2000);
  }

  return (
    <div className="flex flex-col gap-3">
      <p className="text-sm text-ink/50">每間門市共用一組登入 PIN，門市手機統一用這組登入，送單人員在送出採購時再手動填寫。</p>
      {STORES.map(store => (
        <Card key={store} className="p-4">
          <div className="flex items-center justify-between">
            <span className="text-[15px] font-medium">{store}</span>
            <div className="flex items-center gap-2">
              {savedStore === store && <span className="text-xs text-[#4E5747]">已更新</span>}
              <button onClick={() => setResettingStore(resettingStore === store ? null : store)} className="text-sm text-ink/50 underline">
                {resettingStore === store ? '取消' : '重設登入 PIN'}
              </button>
            </div>
          </div>
          {resettingStore === store && (
            <StorePinResetInline onSave={h => resetStorePin(store, h)} onCancel={() => setResettingStore(null)} />
          )}
        </Card>
      ))}
    </div>
  );
}

function ProductsPage() {
  const [tab, setTab] = useState('products');
  return (
    <div>
      <div className="flex items-center gap-2 mb-4">
        <button onClick={() => setTab('products')}
          className={cls('px-4 py-2 rounded-lg text-sm font-medium', tab === 'products' ? 'bg-ink text-cream' : 'bg-black/5 text-ink/60')}>
          商品
        </button>
        <button onClick={() => setTab('staff')}
          className={cls('px-4 py-2 rounded-lg text-sm font-medium', tab === 'staff' ? 'bg-ink text-cream' : 'bg-black/5 text-ink/60')}>
          門市登入 PIN
        </button>
      </div>
      {tab === 'products' ? <ProductsTab /> : <StorePinTab />}
    </div>
  );
}

/* ================= 帳號設定（管理者） ================= */
function ChangePasswordCard() {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit() {
    setErr(''); setMsg('');
    if (next.length < 6) { setErr('新密碼至少需要 6 碼'); return; }
    if (next !== confirm) { setErr('兩次輸入的新密碼不一致'); return; }
    setBusy(true);
    const { data: { user } } = await sb.auth.getUser();
    const { error: reauthError } = await sb.auth.signInWithPassword({ email: user.email, password: current });
    if (reauthError) { setErr('目前密碼不正確'); setBusy(false); return; }
    const { error: updateError } = await sb.auth.updateUser({ password: next });
    setBusy(false);
    if (updateError) { setErr('更新失敗，請稍後再試'); return; }
    setMsg('密碼已更新');
    setCurrent(''); setNext(''); setConfirm('');
  }

  return (
    <Card className="p-4">
      <p className="text-sm font-bold mb-3">修改密碼</p>
      <div className="flex flex-col gap-2.5">
        <input type="password" placeholder="目前密碼" value={current} onChange={e => setCurrent(e.target.value)}
          className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
        <input type="password" placeholder="新密碼（至少 6 碼）" value={next} onChange={e => setNext(e.target.value)}
          className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
        <input type="password" placeholder="確認新密碼" value={confirm} onChange={e => setConfirm(e.target.value)}
          className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
      </div>
      {err && <p className="text-brick text-sm mt-2">{err}</p>}
      {msg && <p className="text-sm mt-2 text-[#4E5747]">{msg}</p>}
      <Button className="mt-3" disabled={busy} onClick={submit}>{busy ? '處理中…' : '更新密碼'}</Button>
    </Card>
  );
}

function AdminAccountsCard({ currentUserId }) {
  const [admins, setAdmins] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    const { data } = await sb.from('users').select('*').eq('role', 'admin').order('name');
    setAdmins(data || []);
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  async function toggleEnabled(u) {
    await sb.from('users').update({ enabled: !u.enabled }).eq('id', u.id);
    await load();
  }

  async function submit() {
    setErr('');
    if (!name.trim() || !email.trim() || !password) { setErr('請完整填寫欄位'); return; }
    setBusy(true);
    const { data: { session: authSession } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-create-admin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authSession.access_token}` },
      body: JSON.stringify({ name: name.trim(), email: email.trim(), password })
    });
    const body = await res.json();
    setBusy(false);
    if (!res.ok) { setErr(body.error || '新增失敗'); return; }
    setName(''); setEmail(''); setPassword(''); setShowForm(false);
    await load();
  }

  return (
    <Card className="p-4">
      <div className="flex items-center justify-between mb-3">
        <p className="text-sm font-bold">管理者帳號</p>
        <button onClick={() => setShowForm(s => !s)} className="text-sm text-ink/50 underline">
          {showForm ? '取消' : '+ 新增管理者'}
        </button>
      </div>

      {showForm && (
        <div className="flex flex-col gap-2.5 mb-4 pb-4 border-b border-black/5">
          <input placeholder="姓名" value={name} onChange={e => setName(e.target.value)}
            className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
          <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)}
            className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
          <input type="password" placeholder="初始密碼（至少 6 碼）" value={password} onChange={e => setPassword(e.target.value)}
            className="px-3 py-2.5 rounded-lg border border-ink/15 text-[15px]" />
          {err && <p className="text-brick text-sm">{err}</p>}
          <Button disabled={busy} onClick={submit}>{busy ? '建立中…' : '建立帳號'}</Button>
        </div>
      )}

      {loading ? <Spinner /> : (
        <div className="flex flex-col gap-2">
          {admins.map(a => (
            <div key={a.id} className={cls('flex items-center justify-between', !a.enabled && 'opacity-50')}>
              <span className="text-[15px]">{a.name}{a.id === currentUserId ? '（你自己）' : ''}</span>
              {a.id !== currentUserId && (
                <button onClick={() => toggleEnabled(a)} className={cls('text-sm underline', a.enabled ? 'text-brick' : 'text-ink/50')}>
                  {a.enabled ? '停用' : '啟用'}
                </button>
              )}
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function AccountPage({ session }) {
  return (
    <div className="flex flex-col gap-4 max-w-md">
      <p className="text-lg font-bold">帳號設定</p>
      <ChangePasswordCard />
      <AdminAccountsCard currentUserId={session.userId} />
    </div>
  );
}

/* ================= App Shell ================= */
function NavBar({ session, screen, onNavigate, onLogout }) {
  const isAdmin = session.role === 'admin';
  const items = [
    { id: 'dashboard', label: 'Dashboard' },
    ...(!isAdmin ? [{ id: 'new', label: '新增採購' }] : []),
    ...(isAdmin ? [{ id: 'manage', label: '採購管理' }] : []),
    ...(isAdmin ? [{ id: 'products', label: '商品管理' }] : []),
    ...(isAdmin ? [{ id: 'account', label: '帳號設定' }] : [])
  ];
  return (
    <div className="sticky top-0 z-40 bg-cream/90 backdrop-blur border-b border-black/5">
      <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <p className="font-black tracking-tight">PHASE 採購</p>
        <div className="flex items-center gap-1">
          {items.map(it => (
            <button key={it.id} onClick={() => onNavigate(it.id)}
              className={cls('px-3 py-2 rounded-lg text-sm font-medium transition',
                screen === it.id ? 'bg-ink text-cream' : 'text-ink/60 hover:bg-black/5')}>
              {it.label}
            </button>
          ))}
          <button onClick={onLogout} className="ml-2 px-3 py-2 rounded-lg text-sm text-ink/40 hover:bg-black/5">登出</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = logged out
  const [screen, setScreenState] = useState(() => localStorage.getItem(SCREEN_KEY) || 'dashboard');

  function setScreen(next) {
    localStorage.setItem(SCREEN_KEY, next);
    setScreenState(next);
  }

  const resolveAdminSession = useCallback(async () => {
    const { data: { session: authSession } } = await sb.auth.getSession();
    if (!authSession) { setSession(null); return; }
    const { data, error } = await sb.from('users').select('*').eq('auth_uid', authSession.user.id).eq('enabled', true).single();
    if (error || !data) { await sb.auth.signOut(); setSession(null); return; }
    setSession({ type: 'admin', role: 'admin', userId: data.id, name: data.name });
  }, []);

  useEffect(() => {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        setSession({ type: 'staff', role: 'staff', store: parsed.store });
        return;
      } catch (e) {}
    }
    resolveAdminSession();
  }, [resolveAdminSession]);

  useEffect(() => {
    if (!session) return;
    const allowed = SCREENS_BY_ROLE[session.role] || ['dashboard'];
    if (!allowed.includes(screen)) setScreen('dashboard');
  }, [session]);

  function handleStaffLogin(store) {
    const s = { type: 'staff', role: 'staff', store };
    localStorage.setItem(SESSION_KEY, JSON.stringify({ store }));
    setSession(s);
    setScreen('dashboard');
  }
  async function handleAdminLogin() {
    await resolveAdminSession();
    setScreen('dashboard');
  }
  async function handleLogout() {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SCREEN_KEY);
    if (session && session.type === 'admin') await sb.auth.signOut();
    setSession(null);
    setScreenState('dashboard');
  }

  if (session === undefined) return <div className="min-h-screen flex items-center justify-center"><Spinner /></div>;
  if (session === null) return <LoginScreen onStaffLogin={handleStaffLogin} onAdminLogin={handleAdminLogin} />;

  return (
    <div className="min-h-screen">
      <NavBar session={session} screen={screen} onNavigate={setScreen} onLogout={handleLogout} />
      <div className="max-w-4xl mx-auto px-4 py-5">
        {screen === 'dashboard' && <Dashboard session={session} onNavigate={setScreen} />}
        {screen === 'new' && <NewRequest session={session} onNavigate={setScreen} />}
        {screen === 'manage' && <ManagePage session={session} onNavigate={setScreen} />}
        {screen === 'products' && <ProductsPage />}
        {screen === 'account' && <AccountPage session={session} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
